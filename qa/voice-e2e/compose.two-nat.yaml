# G-81 two-NAT voice e2e: a call between two homes, each behind its own NAT,
# with only our STUN server to learn the public address. No TURN. Run through
# run-two-nat.sh, which builds what is missing, starts the relay, reads its
# peer ID and passes it in as MVS_RELAY. Each run is its own compose project.
#
#   lan_a (10.81.1.0/24)  a ── nat-a ┐
#                                     ├── wan (10.81.0.0/24): relay, stun
#   lan_b (10.81.2.0/24)  b ── nat-b ┘
#
# All three networks are `internal`: nothing reaches the host's LAN or the
# internet, so the live relay is never involved (QA rule), and no host
# networking is used (SL S5). The apps' only route out is their router.
# The subnets are Docker-private and never printed above debug; the checks
# report candidate types only.

services:
  # Electron and playwright-core for desktop/, into this e2e's own cache
  # volume (deps.sh, unchanged; locked, skipped when installed).
  deps:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /repo/desktop
    volumes:
      - ../..:/repo
      - desktop_node_modules:/repo/desktop/node_modules
      - deps_lock:/lock
      - ./deps.sh:/deps.sh:ro
    command: ["sh", "/deps.sh"]

  relay:
    image: mvs-relay:voice-e2e
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=10001,mode=700
    environment:
      ALLOW_PRIVATE_ADDRS: "1"
      EXTERNAL_ADDRS: /ip4/10.81.0.10/tcp/4001
      RUST_LOG: info
    networks:
      wan: { ipv4_address: 10.81.0.10 }

  # Our STUN server, as infra/ runs it (STUN only, no TURN, no logs).
  # SCENARIO=nostun leaves it out (N-STUN-3).
  stun:
    image: coturn/coturn:4.6.2@sha256:4873c54f213ec81f6b4c4c4938b69c922f50b2293ded427f5191472b9a127227
    command: [-n, --stun-only, --no-cli, --no-tls, --no-dtls, --fingerprint, --listening-port=3478, --no-stdout-log, --log-file=/dev/null, --pidfile=/tmp/turnserver.pid]
    read_only: true
    tmpfs: [/tmp, /var/lib/coturn]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      wan: { ipv4_address: 10.81.0.20 }

  nat-a: &nat
    build: { context: ./two-nat, dockerfile: nat.Dockerfile }
    image: mvs-voice-e2e-nat
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls: { net.ipv4.ip_forward: "1" }
    environment: &natenv
      LAN_SUBNET: 10.81.1.0/24
      WAN_SUBNET: 10.81.0.0/24
      ALL_SUBNETS: 10.81.0.0/24 10.81.1.0/24 10.81.2.0/24
      STUN_IP: 10.81.0.20
      BLOCK_PEER_UDP: ${BLOCK_PEER_UDP:-}
    networks:
      lan_a: { ipv4_address: 10.81.1.2 }
      wan: { ipv4_address: 10.81.0.2 }

  nat-b:
    <<: *nat
    environment:
      <<: *natenv
      LAN_SUBNET: 10.81.2.0/24
    networks:
      lan_b: { ipv4_address: 10.81.2.2 }
      wan: { ipv4_address: 10.81.0.3 }

  # The owner (a) and the member (b), as in compose.yaml, each in its own home.
  a: &app
    build: { context: ./two-nat, dockerfile: client.Dockerfile }
    image: mvs-voice-e2e-app-nat
    working_dir: /repo/desktop
    volumes:
      - ../..:/repo:ro
      - desktop_node_modules:/repo/desktop/node_modules:ro
      - ./.build:/build:ro
      - rendezvous:/rendezvous
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add: [NET_ADMIN] # client.sh: the default route through the router, then dropped to pwuser
    shm_size: 512m
    environment: &env
      ROLE: a
      ROUTER_IP: 10.81.1.2
      MODE: new
      JOIN_VIA: bridge
      MVS_DEBUG_LOG: ${MVS_DEBUG_LOG:-}
      # G-81: a direct path, under SETUP_MAX_MS (call.mjs G81.1, G81.2).
      EXPECT_PATH: direct
      SETUP_MAX_MS: ${SETUP_MAX_MS:-10000}
      MVS_RELAY: ${MVS_RELAY:-}
      # Our STUN server only (a checkout reads MVS_STUN; desktop/src/config.js).
      MVS_STUN: stun:10.81.0.20:3478
      MVS_CORE_PATH: /build/mvs-core
      MVS_UI_DIR: /build/ui
    networks:
      lan_a: { ipv4_address: 10.81.1.10 }
    command: ["sh", "/repo/qa/voice-e2e/two-nat/client.sh"]

  b:
    <<: *app
    environment:
      <<: *env
      ROLE: b
      ROUTER_IP: 10.81.2.2
    networks:
      lan_b: { ipv4_address: 10.81.2.10 }

networks:
  wan:
    internal: true
    ipam: { config: [{ subnet: 10.81.0.0/24 }] }
  lan_a:
    internal: true
    ipam: { config: [{ subnet: 10.81.1.0/24 }] }
  lan_b:
    internal: true
    ipam: { config: [{ subnet: 10.81.2.0/24 }] }

volumes:
  rendezvous:
  # This e2e's own caches, apart from run.sh's (no races with QA's runs).
  desktop_node_modules:
    name: mvs-voice-e2e-nat-desktop-nm-${DEPS_KEY:?run through run-two-nat.sh}
    external: true
  deps_lock:
    name: mvs-voice-e2e-nat-deps-lock
    external: true
